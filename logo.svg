<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="logoGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <!-- Ikon Logo (Kiri) -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="18" fill="url(#logoBgGrad)"/>
    <rect width="78" height="78" x="1" y="1" rx="17" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <!-- Rak Kayu -->
    <rect x="9" y="65" width="62" height="6" rx="2" fill="#854d0e"/>
    <rect x="9" y="65" width="62" height="1.5" rx="0.5" fill="#ca8a04"/>

    <!-- Buku 1: Kuning -->
    <rect x="14" y="24" width="14" height="41" rx="2.5" fill="url(#logoGold)"/>
    <rect x="15.5" y="48" width="11" height="14" rx="1.5" fill="#ffffff"/>
    <line x1="17.5" y1="52" x2="24.5" y2="52" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="17.5" y1="56" x2="23.5" y2="56" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Buku 2: Biru (Tinggi, LCC) -->
    <path d="M 38 14 L 38 8 L 41.5 11.5 L 45 8 L 45 14 Z" fill="#ef4444"/>
    <rect x="32" y="14" width="18" height="51" rx="2.5" fill="url(#logoBlue)"/>
    <rect x="34" y="44" width="14" height="18" rx="2" fill="#ffffff"/>
    <text x="41" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="6" fill="#1e3a8a" text-anchor="middle">LCC</text>
    <line x1="36" y1="55" x2="46" y2="55" stroke="#3b82f6" stroke-width="1"/>
    <line x1="36" y1="58" x2="44" y2="58" stroke="#1e293b" stroke-width="1"/>

    <!-- Buku 3: Hijau -->
    <rect x="53" y="28" width="14" height="37" rx="2.5" fill="url(#logoGreen)"/>
    <rect x="54.5" y="50" width="11" height="12" rx="1.5" fill="#ffffff"/>
    <line x1="56.5" y1="54" x2="63.5" y2="54" stroke="#1e293b" stroke-width="1.2"/>
  </g>

  <!-- Bahagian Tipografi (Kanan) -->
  <g transform="translate(108, 0)">
    <!-- Pill Tag -->
    <rect x="0" y="14" width="86" height="20" rx="10" fill="#e0e7ff"/>
    <text x="43" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#3730a3" text-anchor="middle" letter-spacing="0.5">LCC GAME</text>

    <!-- Tajuk Utama -->
    <text x="0" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#0f172a" letter-spacing="-0.3">
      Permainan Susunan Buku
    </text>

    <!-- Subteks Institusi -->
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#6b21a8">
      Perpustakaan Tun Abdul Razak
    </text>
    <text x="210" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#64748b">
      &#8226; Universiti Teknologi MARA
    </text>
  </g>
</svg>