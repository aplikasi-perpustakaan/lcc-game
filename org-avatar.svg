<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="orgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Latar Belakang Bulatan / Squircle -->
  <rect width="500" height="500" rx="110" fill="url(#orgBg)"/>
  <rect width="492" height="492" x="4" y="4" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>

  <!-- Cahaya Dalaman -->
  <circle cx="250" cy="220" r="180" fill="radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(0,0,0,0) 70%)"/>

  <!-- Ikon Buku Digital & Portal Perpustakaan -->
  <g filter="url(#glow)">
    <!-- Tulang Belakang Buku Tengah / Tiang Menara -->
    <path d="M 250 140 L 250 310" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>

    <!-- Halaman Kiri (Buku Terbuka Berbentuk Gerbang) -->
    <path d="M 246 308 C 200 290 140 295 100 320 L 100 170 C 140 145 200 140 246 158 Z" 
          fill="url(#pageGradLeft)" opacity="0.95"/>
    <path d="M 246 288 C 200 270 140 275 108 298 L 108 178 C 144 157 200 152 246 170 Z" 
          fill="#3b82f6" opacity="0.25"/>

    <!-- Halaman Kanan (Buku Terbuka Berbentuk Gerbang) -->
    <path d="M 254 308 C 300 290 360 295 400 320 L 400 170 C 360 145 300 140 254 158 Z" 
          fill="url(#pageGradRight)" opacity="0.95"/>
    <path d="M 254 288 C 300 270 360 275 392 298 L 392 178 C 356 157 300 152 254 170 Z" 
          fill="#8b5cf6" opacity="0.25"/>

    <!-- Jalur Garisan Digital (Data / Kod) -->
    <line x1="130" y1="205" x2="220" y2="190" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="130" y1="230" x2="215" y2="215" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="130" y1="255" x2="195" y2="242" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <line x1="280" y1="190" x2="370" y2="205" stroke="#4c1d95" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="285" y1="215" x2="370" y2="230" stroke="#4c1d95" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="305" y1="242" x2="370" y2="255" stroke="#4c1d95" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- Bintang / Titik Emas Penanda Perpustakaan Pintar -->
    <circle cx="250" cy="115" r="14" fill="url(#goldAcc)"/>
    <polygon points="250,90 254,106 270,110 254,114 250,130 246,114 230,110 246,106" fill="#fef08a"/>
  </g>

  <!-- Teks Jenama: APLIKASI PERPUSTAKAAN -->
  <text x="250" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">
    APLIKASI
  </text>
  <text x="250" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#c084fc" text-anchor="middle" letter-spacing="4">
    PERPUSTAKAAN
  </text>
  <line x1="170" y1="435" x2="330" y2="435" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
</svg>