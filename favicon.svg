<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldBook" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blueBook" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="greenBook" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Latar Belakang -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Rak Kayu Bawah -->
  <rect x="14" y="102" width="100" height="9" rx="3" fill="#854d0e"/>
  <rect x="14" y="102" width="100" height="2" rx="1" fill="#ca8a04"/>

  <!-- Buku 1: Emas/Kuning (Kiri) -->
  <g filter="url(#dropShadow)">
    <rect x="22" y="38" width="23" height="64" rx="4" fill="url(#goldBook)"/>
    <rect x="24" y="44" width="19" height="2" rx="1" fill="#fef08a" opacity="0.65"/>
    <rect x="24" y="48" width="19" height="1.5" rx="1" fill="#fef08a" opacity="0.4"/>
    <!-- Label Pelekat Putih -->
    <rect x="25" y="74" width="17" height="22" rx="2" fill="#ffffff"/>
    <line x1="28" y1="80" x2="39" y2="80" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="28" y1="85" x2="37" y2="85" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="28" y1="90" x2="35" y2="90" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Buku 2: Biru (Tengah, Tinggi, Ribon Merah) -->
  <g filter="url(#dropShadow)">
    <!-- Penanda Buku / Ribon Merah -->
    <path d="M 60 22 L 60 12 L 65 17 L 70 12 L 70 22 Z" fill="#ef4444"/>
    <rect x="50" y="22" width="28" height="80" rx="4" fill="url(#blueBook)"/>
    <rect x="53" y="28" width="22" height="2.5" rx="1" fill="#bfdbfe" opacity="0.7"/>
    <rect x="53" y="33" width="22" height="1.8" rx="1" fill="#bfdbfe" opacity="0.45"/>
    <!-- Label Pelekat Putih dengan Teks LCC -->
    <rect x="53" y="68" width="22" height="28" rx="3" fill="#ffffff"/>
    <text x="64" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.5">LCC</text>
    <line x1="57" y1="84" x2="71" y2="84" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="57" y1="89" x2="68" y2="89" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Buku 3: Hijau (Kanan) -->
  <g filter="url(#dropShadow)">
    <rect x="83" y="44" width="23" height="58" rx="4" fill="url(#greenBook)"/>
    <rect x="85" y="50" width="19" height="2" rx="1" fill="#bbf7d0" opacity="0.65"/>
    <rect x="85" y="54" width="19" height="1.5" rx="1" fill="#bbf7d0" opacity="0.4"/>
    <!-- Label Pelekat Putih -->
    <rect x="86" y="76" width="17" height="20" rx="2" fill="#ffffff"/>
    <line x1="89" y1="82" x2="100" y2="82" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="89" y1="87" x2="98" y2="87" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>